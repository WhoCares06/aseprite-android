name: Build Aseprite Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  ANDROID_SDK_VERSION: 34
  ANDROID_NDK_VERSION: 26.1.10909125
  SKIASHARP_VERSION: 2.88.6

jobs:
  prepare-skia:
    name: Prepare Skia from SkiaSharp prebuilt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      skia-dir-arm64: ${{ steps.set-path.outputs.skia-dir-arm64 }}
    steps:
      - name: Checkout Aseprite Android
        uses: actions/checkout@v4

      - name: Download SkiaSharp prebuilt
        run: |
          wget -q "https://www.nuget.org/api/v2/package/SkiaSharp.NativeAssets.Android/${{ env.SKIASHARP_VERSION }}" -O skia-sharp.nupkg
          unzip -q skia-sharp.nupkg -d skia-sharp
          echo "=== SkiaSharp contents ==="
          find skia-sharp -name "*.so" | head -20

      - name: Copy Skia libs for arm64-v8a
        run: |
          mkdir -p skia-prebuilt/arm64-v8a/include
          cp skia-sharp/runtimes/android-arm64/native/libSkiaSharp.so skia-prebuilt/arm64-v8a/libskia.so
          cp -r skia-sharp/runtimes/android-arm64/native/include/* skia-prebuilt/arm64-v8a/include/ 2>/dev/null || true
          echo "=== Copied libs ==="
          ls -la skia-prebuilt/arm64-v8a/libskia.so

      - name: Upload Skia artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skia-prebuilt
          path: skia-prebuilt
          retention-days: 30

      - name: Set output path
        id: set-path
        run: |
          echo "skia-dir-arm64=$(pwd)/skia-prebuilt/arm64-v8a" >> $GITHUB_OUTPUT

  build-android:
    name: Build Android App (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: prepare-skia
    steps:
      - name: Checkout Aseprite Android
        uses: actions/checkout@v4

      - name: Download Skia artifacts
        uses: actions/download-artifact@v4
        with:
          name: skia-prebuilt
          path: skia-prebuilt

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-${{ env.ANDROID_SDK_VERSION }} ndk;${{ env.ANDROID_NDK_VERSION }}"

      - name: Configure Skia paths
        run: |
          if [ -d "skia-prebuilt/arm64-v8a" ]; then
            echo "SKIA_DIR_ARM64_V8A=$(pwd)/skia-prebuilt/arm64-v8a" >> $GITHUB_ENV
          fi

      - name: Update CMakeLists with Skia paths
        run: |
          # Use the existing CMakeLists.txt from repo, just inject Skia paths
          SKIA_DIR="${{ env.SKIA_DIR_ARM64_V8A }}"
          if [ ! -f "$SKIA_DIR/libskia.so" ]; then
            echo "Skia not found at: $SKIA_DIR/libskia.so"
            exit 1
          fi
          # The repo's CMakeLists.txt already uses find_library for Skia
          # Just ensure the env var is set for the build
          echo "Using existing CMakeLists.txt with Skia at: $SKIA_DIR"

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-android-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-android
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: aseprite-android-apk
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}