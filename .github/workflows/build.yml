name: Build Aseprite Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  ANDROID_SDK_VERSION: 34
  ANDROID_NDK_VERSION: 26.1.10909125
  SKIASHARP_VERSION: 2.88.6

jobs:
  prepare-skia:
    name: Prepare Skia from SkiaSharp prebuilt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      skia-dir-arm64: ${{ steps.set-path.outputs.skia-dir-arm64 }}
    steps:
      - name: Checkout Aseprite Android
        uses: actions/checkout@v4

      - name: Download SkiaSharp prebuilt
        run: |
          wget -q "https://www.nuget.org/api/v2/package/SkiaSharp.NativeAssets.Android/${{ env.SKIASHARP_VERSION }}" -O skia-sharp.nupkg
          unzip -q skia-sharp.nupkg -d skia-sharp
          echo "=== SkiaSharp contents ==="
          find skia-sharp -name "*.so" | head -20

      - name: Copy Skia libs for all ABIs
        run: |
          mkdir -p skia-prebuilt/arm64-v8a/include
          mkdir -p skia-prebuilt/armeabi-v7a/include
          mkdir -p skia-prebuilt/x86/include
          mkdir -p skia-prebuilt/x64/include
          
          # arm64-v8a
          cp skia-sharp/runtimes/android-arm64/native/libSkiaSharp.so skia-prebuilt/arm64-v8a/libskia.so
          # armeabi-v7a
          cp skia-sharp/runtimes/android-arm/native/libSkiaSharp.so skia-prebuilt/armeabi-v7a/libskia.so
          # x86
          cp skia-sharp/runtimes/android-x86/native/libSkiaSharp.so skia-prebuilt/x86/libskia.so
          # x64
          cp skia-sharp/runtimes/android-x64/native/libSkiaSharp.so skia-prebuilt/x64/libskia.so
          
          # Copy headers (from any ABI, they're the same)
          cp -r skia-sharp/runtimes/android-arm64/native/include/* skia-prebuilt/arm64-v8a/include/ 2>/dev/null || true
          
          echo "=== Copied libs ==="
          ls -la skia-prebuilt/*/libskia.so

      - name: Upload Skia artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skia-prebuilt
          path: skia-prebuilt
          retention-days: 30

      - name: Set output path
        id: set-path
        run: |
          echo "skia-dir-arm64=$(pwd)/skia-prebuilt/arm64-v8a" >> $GITHUB_OUTPUT

  build-android:
    name: Build Android App (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: prepare-skia
    steps:
      - name: Checkout Aseprite Android
        uses: actions/checkout@v4

      - name: Download Skia artifacts
        uses: actions/download-artifact@v4
        with:
          name: skia-prebuilt
          path: skia-prebuilt

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-${{ env.ANDROID_SDK_VERSION }}
            ndk;${{ env.ANDROID_NDK_VERSION }}

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Configure Skia paths
        run: |
          if [ -d "skia-prebuilt/arm64-v8a" ]; then
            echo "SKIA_DIR_ARM64_V8A=$(pwd)/skia-prebuilt/arm64-v8a" >> $GITHUB_ENV
          fi

      - name: Update CMakeLists with Skia paths
        run: |
          cat > app/src/main/cpp/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.22.1)
          project("aseprite-android" LANGUAGES CXX)

          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_CXX_EXTENSIONS OFF)

          if(ANDROID)
            set(CMAKE_ANDROID_STL c++_shared)
            set(CMAKE_CXX_FLAGS "${CMAKE_CXX_FLAGS} -frtti -fexceptions -DANDROID")
          endif()

          set(SKIA_DIR "$ENV{SKIA_DIR_ARM64_V8A}")

          if(NOT EXISTS ${SKIA_DIR}/libskia.so)
            message(FATAL_ERROR "Skia not found at: ${SKIA_DIR}/libskia.so")
          endif()

          set(SKIA_LIBRARY ${SKIA_DIR}/libskia.so)
          set(SKIA_INCLUDE_DIR ${SKIA_DIR}/include)

          include_directories(
            ${SKIA_INCLUDE_DIR}
            ${CMAKE_SOURCE_DIR}/../../../aseprite-source/src
            ${CMAKE_SOURCE_DIR}/../../../aseprite-source/third_party
          )

          add_library(aseprite_core STATIC aseprite_bridge.cpp)
          add_library(aseprite SHARED jni_main.cpp aseprite_bridge.cpp)

          target_link_libraries(aseprite
            aseprite_core
            ${SKIA_LIBRARY}
            ${androidCMake_LIBRARIES}
            log
            android
            EGL
            GLESv3
            dl
          )

          set_target_properties(aseprite PROPERTIES
            LIBRARY_OUTPUT_DIRECTORY ${CMAKE_SOURCE_DIR}/../../../jniLibs/${ANDROID_ABI}
          )
          EOF

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-android-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-android
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: aseprite-android-apk
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}