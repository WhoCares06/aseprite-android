name: Build Aseprite Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  ANDROID_SDK_VERSION: 34
  ANDROID_NDK_VERSION: r26d
  SKIA_BRANCH: aseprite-m124

jobs:
  build-skia:
    name: Build Skia for Android (${{ matrix.android_abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_cpu: arm64
            android_abi: arm64-v8a
            gn_args: 'target_os="android" target_cpu="arm64" is_debug=false is_official_build=true skia_use_system_expat=false skia_use_system_icu=false skia_use_system_libjpeg_turbo=false skia_use_system_libpng=false skia_use_system_libwebp=false skia_use_system_zlib=false'
    steps:
      - name: Checkout Skia
        uses: actions/checkout@v4
        with:
          repository: aseprite/skia
          ref: ${{ env.SKIA_BRANCH }}
          path: skia
          submodules: false

      - name: Setup cache key
        run: |
          echo "CACHE_KEY=skia-${{ matrix.android_abi }}-$(cd skia && git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Restore Skia build cache
        uses: actions/cache@v4
        with:
          path: |
            skia/out/android_${{ matrix.target_cpu }}
            skia/.git
          key: ${{ env.CACHE_KEY }}
          restore-keys: |
            skia-${{ matrix.android_abi }}-

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 git clang lld gn ninja-build

      - name: Sync Skia deps
        working-directory: skia
        run: |
          python3 tools/git-sync-deps

      - name: Setup GN
        working-directory: skia
        run: |
          echo "$PWD/buildtools/linux64" >> $GITHUB_PATH

      - name: Generate build files
        working-directory: skia
        run: |
          bin/gn gen out/android_${{ matrix.target_cpu }} --args='${{ matrix.gn_args }}'

      - name: Build Skia
        working-directory: skia
        run: |
          ninja -C out/android_${{ matrix.target_cpu }} -j$(nproc)

      - name: Package Skia artifacts
        working-directory: skia
        run: |
          mkdir -p ../skia-artifacts/${{ matrix.android_abi }}
          cp out/android_${{ matrix.target_cpu }}/libskia.a ../skia-artifacts/${{ matrix.android_abi }}/
          mkdir -p ../skia-artifacts/${{ matrix.android_abi }}/include
          cp -r include/* ../skia-artifacts/${{ matrix.android_abi }}/include/

      - name: Upload Skia artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skia-${{ matrix.android_abi }}
          path: skia-artifacts/${{ matrix.android_abi }}
          retention-days: 30

  build-android:
    name: Build Android App
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build-skia
    steps:
      - name: Checkout Aseprite Android
        uses: actions/checkout@v4

      - name: Download Skia artifacts
        uses: actions/download-artifact@v4
        with:
          path: skia-prebuilt
          pattern: skia-*
          merge-multiple: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.ANDROID_SDK_VERSION }}
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Configure Skia paths
        run: |
          for abi in arm64-v8a; do
            if [ -d "skia-prebuilt/$abi" ]; then
              echo "SKIA_DIR_${abi//-/_}=$(pwd)/skia-prebuilt/$abi" >> $GITHUB_ENV
            fi
          done

      - name: Update CMakeLists with Skia paths
        run: |
          cat > app/src/main/cpp/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.22.1)
          project("aseprite-android" LANGUAGES CXX)

          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_CXX_EXTENSIONS OFF)

          if(ANDROID)
            set(CMAKE_ANDROID_STL c++_shared)
            set(CMAKE_CXX_FLAGS "${CMAKE_CXX_FLAGS} -frtti -fexceptions -DANDROID")
          endif()

          # Skia paths per ABI
          set(SKIA_DIRS
            arm64-v8a "$ENV{SKIA_DIR_ARM64_V8A}"
          )

          foreach(abi_path ${SKIA_DIRS})
            list(GET abi_path 0 abi)
            list(GET abi_path 1 path)
            if(ANDROID_ABI STREQUAL abi AND EXISTS ${path}/libskia.a)
              set(SKIA_DIR ${path})
              message(STATUS "Found Skia for ${abi}: ${path}")
            endif()
          endforeach()

          if(NOT SKIA_DIR)
            message(FATAL_ERROR "Skia not found for ABI: ${ANDROID_ABI}")
          endif()

          set(SKIA_LIBRARY ${SKIA_DIR}/libskia.a)
          set(SKIA_INCLUDE_DIR ${SKIA_DIR}/include)

          include_directories(
            ${SKIA_INCLUDE_DIR}
            ${CMAKE_SOURCE_DIR}/../../../aseprite-source/src
            ${CMAKE_SOURCE_DIR}/../../../aseprite-source/third_party
          )

          add_library(aseprite_core STATIC aseprite_bridge.cpp)
          add_library(aseprite SHARED jni_main.cpp aseprite_bridge.cpp)

          target_link_libraries(aseprite
            aseprite_core
            ${SKIA_LIBRARY}
            ${androidCMake_LIBRARIES}
            log
            android
            EGL
            GLESv3
            dl
          )

          set_target_properties(aseprite PROPERTIES
            LIBRARY_OUTPUT_DIRECTORY ${CMAKE_SOURCE_DIR}/../../../jniLibs/${ANDROID_ABI}
          )
          EOF

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-android-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-android
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: aseprite-android-apk
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}